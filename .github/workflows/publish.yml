name: Publish

# Run this from the Actions tab after merging a PR to main.
#
# Releases are recorded as tags only. main is protected and CI cannot push to
# it, so nothing is committed back: the version is stamped in at build time by
# publish-nuget, and the docs are deployed straight to GitHub Pages.

permissions:
  contents: write

on:
  # This allows us to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version-strategy:
        type: choice
        description: 'Version strategy'
        required: true
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'explicit'
        default: minor
      version:
        type: string
        description: 'Exact version to release, e.g. 4.5.0. Only used when the strategy is "explicit".'
        required: false
        default: ''
      title:
        type: string
        description: 'Release title, e.g. "Add recommendations functionality"'
        required: true
      publish-to-nuget:
        type: boolean
        description: 'Publish the package to NuGet.'
        required: false
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tag_release:
    name: Tag release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # The next-version action reads the latest release from the tags, and
          # the default checkout fetches none.
          fetch-tags: true
          fetch-depth: 0

      - name: Fail if not releasing from the default branch
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::Releases must be cut from ${{ github.event.repository.default_branch }}, got ${{ github.ref_name }}."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve git identity
        uses: ./.github/actions/git-identity
        id: identity

      - name: Resolve next version
        uses: ./.github/actions/next-version
        id: next-version
        with:
          version-strategy: ${{ inputs.version-strategy }}
          version: ${{ inputs.version }}

      - name: Build and test
        run: ./build.sh Release --clean --test

      - name: Create and push tag
        # An annotated tag takes its tagger from the committer, so the triggering
        # user goes in GIT_COMMITTER_* for the release to be attributed to them.
        # The values are passed as env rather than interpolated, so a title
        # containing quotes cannot break the commands.
        env:
          GIT_COMMITTER_NAME: ${{ steps.identity.outputs.actor-name }}
          GIT_COMMITTER_EMAIL: ${{ steps.identity.outputs.actor-email }}
          TAG: ${{ steps.next-version.outputs.next-tag }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail

          # Push just the new tag; tags are not covered by the branch protection.
          git tag -a "$TAG" -m "$TITLE"
          git push origin "$TAG"

    outputs:
      version: ${{ steps.next-version.outputs.next-version }}
      tag: ${{ steps.next-version.outputs.next-tag }}

  create_github_release:
    name: Create GitHub release
    needs: tag_release
    uses: ./.github/workflows/create-github-release.yml
    with:
      version: ${{ needs.tag_release.outputs.tag }}
      title: ${{ inputs.title }}
    secrets: inherit

  publish_to_nuget:
    name: Publish to NuGet
    needs: [tag_release, create_github_release]
    if: ${{ inputs.publish-to-nuget }}
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.tag_release.outputs.version }}
      ref: ${{ needs.tag_release.outputs.tag }}
    secrets: inherit

  # The generated docs do not embed the version (PROJECT_NUMBER is unset, and
  # the version field is private), so this only needs the tagged code and does
  # not hold up the package.
  deploy_docs:
    name: Deploy documentation
    needs: tag_release
    uses: ./.github/workflows/generate-docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ needs.tag_release.outputs.tag }}
      deploy: true
    secrets: inherit

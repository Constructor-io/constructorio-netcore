name: Publish

# Run this from the Actions tab after merging a PR to main.

permissions:
  contents: write

on:
  # This allows us to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version-strategy:
        type: choice
        description: 'Version strategy'
        required: true
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'explicit'
        default: minor
      version:
        type: string
        description: 'Exact version to release, e.g. 4.5.0. Only used when the strategy is "explicit".'
        required: false
        default: ''
      title:
        type: string
        description: 'Release title, e.g. "Add recommendations functionality"'
        required: true
      publish-to-nuget:
        type: boolean
        description: 'Publish the package to NuGet.'
        required: false
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  bump_version:
    name: Bump version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Tags are needed so the next-version action can detect a version that
          # has already been released; the default checkout fetches none.
          fetch-tags: true
          fetch-depth: 0

      - name: Fail if not releasing from the default branch
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::Releases must be cut from ${{ github.event.repository.default_branch }}, got ${{ github.ref_name }}."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve git identity
        uses: ./.github/actions/git-identity
        id: identity

      - name: Resolve next version
        uses: ./.github/actions/next-version
        id: next-version
        with:
          version-strategy: ${{ inputs.version-strategy }}
          version: ${{ inputs.version }}

      - name: Set new version
        uses: ./.github/actions/set-version
        with:
          version: ${{ steps.next-version.outputs.next-version }}

      - name: Build and test at the new version
        run: ./build.sh Release --clean --test

      - name: Commit version bump
        id: commit
        # The person who ran the workflow is the author; the bot is only the
        # committer, which is what actually performed the push.
        env:
          GIT_AUTHOR_NAME: ${{ steps.identity.outputs.actor-name }}
          GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.actor-email }}
          GIT_COMMITTER_NAME: ${{ steps.identity.outputs.bot-name }}
          GIT_COMMITTER_EMAIL: ${{ steps.identity.outputs.bot-email }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git add src
          git commit -m 'Version Bump'

          # --force-with-lease rather than a plain push: if the branch moved
          # after this job checked it out, the merged code was never built or
          # validated here, so the release must stop rather than absorb it.
          git push --force-with-lease origin "HEAD:$TARGET_BRANCH"

          # Later jobs check out this exact commit instead of re-resolving the
          # branch, so a merge landing mid-release cannot enter the tag.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.next-version.outputs.next-version }}
      tag: ${{ steps.next-version.outputs.next-tag }}
      sha: ${{ steps.commit.outputs.sha }}

  # The generated docs do not embed the version (PROJECT_NUMBER is unset, and
  # the version field is private), so this runs here only so that any doc
  # changes from the merged code land before the tag is cut.
  generate_docs:
    name: Generate documentation
    needs: bump_version
    uses: ./.github/workflows/generate-docs.yml
    with:
      # Generate from the bump commit, not the branch tip, and push to the
      # branch separately.
      ref: ${{ needs.bump_version.outputs.sha }}
      target-branch: ${{ github.ref_name }}
      commit: true
      commit-message: 'Update documentation for ${{ needs.bump_version.outputs.tag }}'
    secrets: inherit

  tag_release:
    name: Tag release
    needs: [bump_version, generate_docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag the exact revision this release validated — the docs commit if
          # one was made, otherwise the version bump — rather than whatever the
          # branch points at now.
          ref: ${{ needs.generate_docs.outputs.sha || needs.bump_version.outputs.sha }}
          # An annotated tag is created here, so the commit being tagged and the
          # existing tags both need to be present locally.
          fetch-tags: true
          fetch-depth: 0

      - name: Resolve git identity
        uses: ./.github/actions/git-identity
        id: identity

      - name: Create and push tag
        # An annotated tag takes its tagger from the committer, not the author,
        # so the triggering user goes in GIT_COMMITTER_* here for the release to
        # be attributed to them. The values are passed as env rather than
        # interpolated, so a title containing quotes cannot break the commands.
        env:
          GIT_COMMITTER_NAME: ${{ steps.identity.outputs.actor-name }}
          GIT_COMMITTER_EMAIL: ${{ steps.identity.outputs.actor-email }}
          TAG: ${{ needs.bump_version.outputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail

          # Tag the version bump and docs commits pushed by the jobs above.
          git tag -a "$TAG" -m "$TITLE"
          git push origin "$TAG"

  create_github_release:
    name: Create GitHub release
    needs: [bump_version, tag_release]
    uses: ./.github/workflows/create-github-release.yml
    with:
      version: ${{ needs.bump_version.outputs.tag }}
      title: ${{ inputs.title }}
    secrets: inherit

  publish_to_nuget:
    name: Publish to NuGet
    needs: [bump_version, create_github_release]
    if: ${{ inputs.publish-to-nuget }}
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.bump_version.outputs.version }}
      ref: ${{ needs.bump_version.outputs.tag }}
    secrets: inherit

name: 'Publish: Create GitHub release'

# We need these permissions to create new GitHub releases.
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: 'Tag to create the release from, including the "v" prefix.'
        required: true
      title:
        type: string
        description: 'Release title.'
        required: true

  # This workflow is intended to be called from the primary publish workflow
  # automatically. The manual trigger is maintained for partially failed workflows
  # or edge cases that require this be run independently.
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Tag to create the release from, including the "v" prefix.'
        required: true
      title:
        type: string
        description: 'Release title.'
        required: true

jobs:
  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: ncipollo/release-action@6c75be85e571768fa31b40abf38de58ba0397db5 # v1.13.0
        with:
          name: ${{ inputs.title }}
          tag: ${{ inputs.version }}
          token: ${{ github.token }}
          generateReleaseNotes: true

name: 'Publish: Generate documentation'

# We need these permissions to commit the regenerated docs back to the branch.
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: 'Branch or ref to generate the documentation from.'
        required: false
        default: ''
      commit:
        type: boolean
        description: 'Commit the regenerated docs. When false, they are only uploaded as an artifact.'
        required: false
        default: true
      commit-message:
        type: string
        description: 'Commit message to use when the docs change.'
        required: false
        default: 'Update documentation'
    outputs:
      docs-changed:
        description: 'Whether regenerating the docs produced any change.'
        value: ${{ jobs.generate-docs.outputs.docs-changed }}

  # This workflow is intended to be called from the primary publish workflow
  # automatically. The manual trigger is maintained for refreshing the docs on
  # their own, outside of a release.
  workflow_dispatch:
    inputs:
      commit:
        type: boolean
        description: 'Commit the regenerated docs. When false, they are only uploaded as an artifact.'
        required: false
        default: true
      commit-message:
        type: string
        description: 'Commit message to use when the docs change.'
        required: false
        default: 'Update documentation'

env:
  # Pinned, because the generator version is baked into every page footer and a
  # different version reflows all of docs/. Keep this in step with the version
  # the docs were last generated with.
  DOXYGEN_VERSION: '1.15.0'

jobs:
  generate-docs:
    name: Generate documentation
    runs-on: ubuntu-latest

    outputs:
      docs-changed: ${{ steps.commit.outputs.docs-changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Doxygen
        run: |
          set -euo pipefail

          # The apt package lags well behind, so pull the pinned release directly.
          url="https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"

          curl --fail --silent --show-error --location "$url" --output doxygen.tar.gz
          tar --extract --gzip --file doxygen.tar.gz

          sudo install "doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
          rm -rf doxygen.tar.gz "doxygen-${DOXYGEN_VERSION}"

          doxygen --version

      - name: Generate documentation
        run: |
          set -euo pipefail

          # The committed Doxyfile leaves the paths below empty so they can be
          # pointed at a local checkout. Rather than editing it, append the CI
          # values — for repeated keys Doxygen honours the last one it reads.
          {
            cat Doxyfile
            echo 'INPUT = src/constructor.io src/Constructorio_NET.Tests README.md'
            echo 'OUTPUT_DIRECTORY = docs'
            echo 'HTML_OUTPUT = .'
          } > Doxyfile.ci

          doxygen Doxyfile.ci

          rm Doxyfile.ci

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs

      - name: Resolve git identity
        if: ${{ inputs.commit }}
        uses: ./.github/actions/git-identity
        id: identity

      - name: Commit documentation
        id: commit
        if: ${{ inputs.commit }}
        # The person who ran the workflow is the author; the bot is only the
        # committer. Passed as env rather than interpolated into the script, so a
        # message containing quotes cannot break or inject into the commands.
        env:
          GIT_AUTHOR_NAME: ${{ steps.identity.outputs.actor-name }}
          GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.actor-email }}
          GIT_COMMITTER_NAME: ${{ steps.identity.outputs.bot-name }}
          GIT_COMMITTER_EMAIL: ${{ steps.identity.outputs.bot-email }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          TARGET_BRANCH: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail

          git add docs

          if git diff --cached --quiet; then
            echo 'Documentation is already up to date.'
            echo 'docs-changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:$TARGET_BRANCH"

          echo 'docs-changed=true' >> "$GITHUB_OUTPUT"

name: 'Publish: Generate documentation'

# GitHub Pages is deployed from this workflow (Settings → Pages → Source:
# GitHub Actions), not from a committed docs/ folder, because CI cannot push to
# the protected main branch.
permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: 'Branch or tag to generate the documentation from.'
        required: false
        default: ''
      deploy:
        type: boolean
        description: 'Deploy the docs to GitHub Pages. When false, they are only uploaded as an artifact.'
        required: false
        default: true

  # This workflow is intended to be called from the primary publish workflow
  # automatically. The manual trigger is maintained for refreshing the docs on
  # their own, outside of a release.
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        description: 'Deploy the docs to GitHub Pages. When false, they are only uploaded as an artifact.'
        required: false
        default: true

env:
  # Pinned, because the generator version is baked into every page footer.
  DOXYGEN_VERSION: '1.15.0'

jobs:
  generate-docs:
    name: Generate documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Doxygen
        run: |
          set -euo pipefail

          # The apt package lags well behind, so pull the pinned release directly.
          url="https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"

          curl --fail --silent --show-error --location "$url" --output doxygen.tar.gz
          tar --extract --gzip --file doxygen.tar.gz

          sudo install "doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
          rm -rf doxygen.tar.gz "doxygen-${DOXYGEN_VERSION}"

          doxygen --version

      - name: Generate documentation
        run: |
          set -euo pipefail

          # The committed Doxyfile leaves the paths below empty so they can be
          # pointed at a local checkout. Rather than editing it, append the CI
          # values — for repeated keys Doxygen honours the last one it reads.
          {
            cat Doxyfile
            echo 'INPUT = src/constructor.io src/Constructorio_NET.Tests README.md'
            echo 'OUTPUT_DIRECTORY = docs'
            echo 'HTML_OUTPUT = .'
          } > Doxyfile.ci

          doxygen Doxyfile.ci

          rm Doxyfile.ci

      # Also serves as the inspectable artifact when not deploying.
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: generate-docs
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
